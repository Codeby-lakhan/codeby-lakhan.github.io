<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lakhan Singh ~/ terminal</title>
  <meta name="description" content="Interactive terminal-style resume for Lakhan Singh — Generative AI & Full-Stack Engineer." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0c0c14; --fg:#e2e8f0; --cyan:#00e5ff; --yellow:#ffd500; --pink:#ff6b6b; --green:#7bed9f; --dim:#64748b; --border:#2b2b45; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--fg); font-family:'Fira Code', ui-monospace, monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px 16px; }
    header { width:100%; max-width:820px; display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    header a { color:var(--cyan); text-decoration:underline wavy var(--pink); text-underline-offset:4px; font-size:13px; }
    header h1 { font-family:'Space Grotesk', sans-serif; font-size:18px; letter-spacing:1px; }
    header h1 span { color:var(--yellow); }
    .win { width:100%; max-width:820px; background:#0f0f1a; border:2px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:0 0 0 2px #000, 0 18px 40px rgba(0,0,0,.6); }
    .win-bar { display:flex; align-items:center; gap:8px; padding:10px 14px; background:#17172b; border-bottom:2px solid var(--border); }
    .dot { width:13px; height:13px; border-radius:50%; }
    .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
    .win-title { margin-left:8px; font-size:12px; color:var(--dim); }
    .screen { height:560px; overflow-y:auto; padding:18px 20px; font-size:14px; line-height:1.7; }
    .line { white-space:pre-wrap; word-break:break-word; }
    .line .p { color:var(--yellow); }
    .line .d { color:var(--cyan); }
    .line .c { color:var(--green); }
    .line .err { color:var(--pink); }
    .line .dim { color:var(--dim); }
    .table { display:grid; row-gap:2px; margin:6px 0; }
    .table .row { display:grid; grid-template-columns:150px 1fr; gap:12px; }
    .table .k { color:var(--yellow); }
    .input-line { display:flex; align-items:center; gap:8px; padding-top:4px; }
    .prompt { color:var(--green); }
    .input { flex:1; background:transparent; border:none; outline:none; color:var(--fg); font-family:inherit; font-size:14px; caret-color:var(--cyan); }
    .hint { margin-top:12px; font-size:12px; color:var(--dim); text-align:center; }
    .hint span { color:var(--cyan); }
    @media (max-width:600px){ .table .row{ grid-template-columns:110px 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>lakhan<span>@</span>portfolio<span>~</span></h1>
    <a href="index.html">← back to site</a>
  </header>
  <div class="win">
    <div class="win-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="win-title">lakhan@portfolio: ~ — zsh</span>
    </div>
    <div class="screen" id="screen" tabindex="0"></div>
  </div>
  <p class="hint">type <span>help</span> to see commands · <span>↑/↓</span> for history · <span>theme</span> to switch colors</p>

  <script>
    const screen = document.getElementById('screen');
    const DATA = {
      about: `Lakhan Singh · Generative AI & Full-Stack Engineer\nB.Tech CSE (AI & DS) @ Poornima University, Jaipur · GPA 9.18/10\nAgentic AI | RAG | LangGraph | PyTorch | Node.js`,
      skills: [`AI & Agentic`, `.   LangGraph · LangChain (LCEL) · Groq API (Llama 3.x)`, `    Gemini 1.5 Pro Vision · CRAG · Self-RAG · Multi-Agent`, `ML & Data`, `    PyTorch · EDA · Pandas · NumPy · Matplotlib · Seaborn`, `Vector Search`, `    FAISS (multi-tenant) · FastEmbed(bge-small-en-v1.5)`, `Full Stack & DevOps`, `    Node.js · Express · MongoDB · MySQL · Passport.js`, `Languages`, `    Python · Java · JavaScript · C · SQL · HTML/CSS`].join('\n'),
      projects: [
        ['AlignAgent', 'Agentic RAG skill-gap analyzer · LangGraph + Groq + FAISS'],
        ['CommunityHero', 'Civic issue platform · LangGraph + Gemini Vision · Vibe2Code 2026'],
        ['WanderLust', 'Accommodation marketplace · Node.js + Express + MongoDB'],
        ['college-rag-chatbot', 'Document QA · LangChain + FAISS + Gemini 2.5 Flash'],
      ].map(([n, d]) => `${n.padEnd(16)} ${d}`).join('\n'),
      education: `B.Tech CSE (AI & DS) — Poornima University, Jaipur (2024-2028)\nGPA: 9.18/10\nCertifications: Full Stack MERN (Apna College) · Soft Skills (NPTEL)\nDSA: 300+ LeetCode problems (Java)`,
      experience: `Full Stack Developer Intern — Cognifyz Technologies (Jun 2025 - Aug 2025, Remote)\n.   Express.js REST APIs + JWT auth · protected route middleware\n.   MongoDB schemas w/ compound indexes · React integration\nHackathons: Google Vibe2Code 2026 · Bharatiya Antariksh 2026 (ISRO)`,
      contact: `GitHub   https://github.com/codeby-lakhan\nLinkedIn  https://www.linkedin.com/in/codeby-lakhan\nEmail     lakhansingh9138@gmail.com\nLocation  Jaipur, India`,
      help: `Available commands:\n  about        the (very short) story\n  skills       tech stack\n  projects     featured repos\n  education    academics & certifications\n  experience   internships & hackathons\n  contact      reach me\n  repo <name>  open a project on GitHub\n  theme        cycle terminal colors\n  clear        wipe the screen\n  help         this menu`,
      welcome: `Welcome to the terminal resume of\n` + `LAKHAN SINGH — Generative AI & Full-Stack Engineer\n` + `.   try 'help' to begin`
    };

    const THEMES = [
      {prop:':root', set:`--fg:#e2e8f0;--bg:#0c0c14;--cyan:#00e5ff;--yellow:#ffd500;--pink:#ff6b6b;--green:#7bed9f;--dim:#64748b;--border:#2b2b45;`},
      {prop:'.win', set:`background:#1a1b26;border-color:#3b4261`},
      {prop:'.win-bar', set:`background:#24283b;border-color:#3b4261`},
    ];

    let history = [];
    let hIndex = -1;

    function colorize(text, dim) {
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/https?:\/\/\S+/g, (m) => `<span class="c">${m}</span>`);
    }
    function print(text, cls) {
      const div = document.createElement('div');
      div.className = 'line' + (cls ? ' ' + cls : '');
      div.innerHTML = colorize(text);
      screen.appendChild(div);
      scrollDown();
    }
    function helpTable(item) {
      const t = document.createElement('div');
      t.className = 'table';
      item.split('\n').forEach((row) => {
        const r = document.createElement('div'); r.className = 'row';
        const [k, ...rest] = row.split(/ (.+)/);
        const kEl = document.createElement('span'); kEl.className = 'k'; kEl.textContent = k || ' ';
        const vEl = document.createElement('span'); vEl.innerHTML = colorize(rest.join(' '));
        r.appendChild(kEl); r.appendChild(vEl); t.appendChild(r);
      });
      screen.appendChild(t); scrollDown();
    }
    function scrollDown() { screen.scrollTop = screen.scrollHeight; }

    function run(cmdRaw) {
      const cmd = cmdRaw.trim();
      print('lakhan@portfolio: ~ $ ' + cmd, 'dim');
      if (!cmd) return;
      const [name, ...args] = cmd.split(/\s+/);
      switch (name) {
        case 'help': helpTable(DATA.help.replace(/^\s+/, '')); break;
        case 'about': print(DATA.about); break;
        case 'skills': print(DATA.skills); break;
        case 'projects': helpTable(DATA.projects.split('\n').join('\n')); break;
        case 'education': print(DATA.education); break;
        case 'experience': print(DATA.experience); break;
        case 'contact': print(DATA.contact); break;
        case 'repo': {
          const target = args[0] && {
            alignagent: 'AlignAgent', communityhero: 'CommunityHero',
            wanderlust: 'WanderLust', chatbot: 'college-rag-chatbot'
          }[args[0].toLowerCase()];
          if (target) window.open(`https://github.com/codeby-lakhan/${target}`, '_blank');
          else print('usage: repo <alignagent|communityhero|wanderlust|chatbot>', 'err');
          break;
        }
        case 'theme': {
          const i = Math.floor(Math.random() * 3);
          document.documentElement.style.cssText = ['--fg:#ffe9a8;--bg:#120c1f;--cyan:#ffd500;--yellow:#ff5f9e;--pink:#b388ff;--green:#7bed9f;--dim:#9a8fb8;--border:#3a2f5c', '--fg:#f0faf5;--bg:#0e1614;--cyan:#5eead4;--yellow:#fbbf24;--pink:#fb7185;--green:#4ade80;--dim:#7c9089;--border:#22403a', '--fg:#e0e7ff;--bg:#111432;--cyan:#818cf8;--yellow:#fde047;--pink:#f472b6;--green:#34d399;--dim:#7b84b8;--border:#333a7a'][i];
          print('theme switched 😎', 'dim');
          break;
        }
        case 'clear': screen.innerHTML = ''; break;
        case 'ls': print('index.html  neo-styles.css  script.js  README.md', 'c'); break;
        default:
          print(`command not found: ${name} — try 'help'`, 'err');
      }
    }

    /* bootstrap */
    print(DATA.welcome, 'dim');
    function ensureLine() {
      const line = screen.querySelector('.input-line');
      if (line) return;
      const div = document.createElement('div');
      div.className = 'input-line';
      const p = document.createElement('span'); p.className = 'prompt'; p.textContent = '❯ ';
      const inp = document.createElement('input'); inp.className = 'input'; inp.autocomplete = 'off'; inp.spellcheck = false;
      div.appendChild(p); div.appendChild(inp);
      screen.appendChild(div); scrollDown();
      inp.focus();
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { const v = inp.value; run(v); history.push(v); hIndex = history.length; ensureLine(); }
        else if (e.key === 'ArrowUp') { if (hIndex > 0) { hIndex--; inp.value = history[hIndex] || ''; } e.preventDefault(); }
        else if (e.key === 'ArrowDown') { if (hIndex < history.length) { hIndex++; inp.value = history[hIndex] || ''; } e.preventDefault(); }
      });
    }
    ensureLine();
    screen.addEventListener('click', () => { const i = screen.querySelector('.input'); i && i.focus(); });
  </script>
</body>
</html>
